name: bluddit-local
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluddit}
      POSTGRES_DB: ${POSTGRES_DB:-bluddit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; copy .env.example first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
  nginx:
    image: nginx:stable-alpine
    ports:
      - 127.0.0.1:${LOCAL_PORT:-8080}:80
    volumes:
      - ./infra/nginx/application.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
volumes:
  postgres_data:
