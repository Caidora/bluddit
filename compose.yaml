name: bluddit-local
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluddit}
      POSTGRES_DB: ${POSTGRES_DB:-bluddit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; copy .env.example first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [python, -m, bluddit_api.migrate, apply]
    environment: &database_environment
      APP_ENV: ${APP_ENV:-development}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:${LOCAL_PORT:-8080},http://127.0.0.1:${LOCAL_PORT:-8080}}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-bluddit}
      PGUSER: ${POSTGRES_USER:-bluddit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *database_environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
  nginx:
    image: nginx:stable-alpine
    ports:
      - 127.0.0.1:${LOCAL_PORT:-8080}:80
    volumes:
      - ./infra/nginx/application.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/ready && wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
