name: bluddit
services:
  db:
    image: ${DB_IMAGE:?DB_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluddit
      POSTGRES_DB: bluddit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bluddit -d bluddit']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?AUTH_ALLOWED_ORIGINS is required}
      PGHOST: db
      PGDATABASE: bluddit
      PGUSER: bluddit
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET_FILE: /run/secrets/blizzard_client_secret
      BLIZZARD_REGION: ${BLIZZARD_REGION:-us}
      BLIZZARD_LOCALE: ${BLIZZARD_LOCALE:-en_US}
      BLIZZARD_STATIC_NAMESPACE: ${BLIZZARD_STATIC_NAMESPACE:-static-1.60.1_70399-forever-us}
    secrets:
      - source: api_postgres_password
        target: postgres_password
      - source: blizzard_client_secret
        target: blizzard_client_secret
    depends_on:
      db:
        condition: service_healthy
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    profiles: [migrations]
    command: [python, -m, bluddit_api.migrate, apply]
    environment:
      PGHOST: db
      PGDATABASE: bluddit
      PGUSER: bluddit
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: api_postgres_password
        target: postgres_password
    healthcheck:
      disable: true
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    restart: unless-stopped
    ports:
      - 127.0.0.1:18080:80
    volumes:
      - ./nginx/application.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/ready && wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
secrets:
  blizzard_client_secret:
    file: ${APP_ROOT:?APP_ROOT is required}/shared/blizzard_client_secret
  api_postgres_password:
    file: ${APP_ROOT:?APP_ROOT is required}/shared/api_postgres_password
  postgres_password:
    file: ${APP_ROOT:?APP_ROOT is required}/shared/postgres_password
volumes:
  postgres_data:
    external: true
    name: bluddit_postgres_data
