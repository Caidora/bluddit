name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation (deployment uses this workflow commit)
        type: choice
        options: [deploy, rollback, verify, backup, restart]
        default: deploy
      release:
        description: Recorded release ID for rollback (full commit SHA-workflow run ID)
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres-test:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: bluddit_test
          POSTGRES_USER: bluddit_test
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bluddit_test -d bluddit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.6.13'
          python-version: '3.13'
      - name: Install locked dependencies
        run: make setup
      - name: Verify web, API, infrastructure, and configuration
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          TEST_DATABASE_URL: postgresql://bluddit_test:ci-test-password@localhost:5432/bluddit_test
        run: make verify
      - name: Build and smoke-test production containers
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        run: |
          docker compose build
          docker compose up -d --wait db
          docker compose run --rm --no-deps -T migrate
          docker compose run --rm --no-deps -T migrate
          docker compose up -d --wait --wait-timeout 180
          python3 infra/smoke.py http://127.0.0.1:8080
          docker compose exec -T api id -u | grep -qx 10001
          docker compose exec -T web id -u | grep -qx 1000
      - name: Stop disposable stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        run: docker compose down --volumes

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.refs.outputs.web }}
      api: ${{ steps.refs.outputs.api }}
      db: ${{ steps.refs.outputs.db }}
      nginx: ${{ steps.refs.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-web:${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:${{ github.sha }}
      - name: Resolve immutable deployment references
        id: refs
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          echo "web=$PREFIX-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "api=$PREFIX-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          db=$(docker buildx imagetools inspect postgres:17-bookworm --format '{{.Manifest.Digest}}')
          nginx=$(docker buildx imagetools inspect nginx:stable-alpine --format '{{.Manifest.Digest}}')
          echo "db=postgres@$db" >> "$GITHUB_OUTPUT"
          echo "nginx=nginx@$nginx" >> "$GITHUB_OUTPUT"
      - name: Test the exact published image digests
        env:
          WEB_IMAGE: ${{ steps.refs.outputs.web }}
          API_IMAGE: ${{ steps.refs.outputs.api }}
          DB_IMAGE: ${{ steps.refs.outputs.db }}
          NGINX_IMAGE: ${{ steps.refs.outputs.nginx }}
          APP_ROOT: ${{ runner.temp }}/candidate
        run: |
          mkdir -p "$APP_ROOT/shared"
          printf '%s' 'ci-disposable-password' > "$APP_ROOT/shared/postgres_password"
          cp "$APP_ROOT/shared/postgres_password" "$APP_ROOT/shared/api_postgres_password"
          chmod 0444 "$APP_ROOT/shared/api_postgres_password"
          docker volume create bluddit_postgres_data
          docker compose -f infra/compose.production.yaml up -d --wait db
          docker compose -f infra/compose.production.yaml run --rm --no-deps -T migrate
          docker compose -f infra/compose.production.yaml run --rm --no-deps -T migrate
          docker compose -f infra/compose.production.yaml up -d --wait --wait-timeout 180
          python3 infra/smoke.py http://127.0.0.1:18080
      - name: Save public image verification metadata
        env:
          WEB_IMAGE: ${{ steps.refs.outputs.web }}
          API_IMAGE: ${{ steps.refs.outputs.api }}
          DB_IMAGE: ${{ steps.refs.outputs.db }}
          NGINX_IMAGE: ${{ steps.refs.outputs.nginx }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = {key: os.environ[key] for key in ("WEB_IMAGE", "API_IMAGE", "DB_IMAGE", "NGINX_IMAGE")}
          metadata["release_id"] = os.environ["GITHUB_SHA"] + "-" + os.environ["GITHUB_RUN_ID"]
          Path("deployment-images.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-images
          path: deployment-images.json
          retention-days: 30
      - name: Stop published-image test stack
        if: always() && steps.refs.outcome == 'success'
        env:
          WEB_IMAGE: ${{ steps.refs.outputs.web }}
          API_IMAGE: ${{ steps.refs.outputs.api }}
          DB_IMAGE: ${{ steps.refs.outputs.db }}
          NGINX_IMAGE: ${{ steps.refs.outputs.nginx }}
          APP_ROOT: ${{ runner.temp }}/candidate
        run: docker compose -f infra/compose.production.yaml down

  production:
    needs: [verify, publish]
    if: >-
      always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' &&
      (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    concurrency:
      group: bluddit-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      TLS_EMAIL: ${{ secrets.TLS_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      WEB_IMAGE: ${{ needs.publish.outputs.web }}
      API_IMAGE: ${{ needs.publish.outputs.api }}
      DB_IMAGE: ${{ needs.publish.outputs.db }}
      NGINX_IMAGE: ${{ needs.publish.outputs.nginx }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      OPERATION: ${{ inputs.operation || 'deploy' }}
      TARGET_RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        run: bash infra/scripts/ssh-setup.sh
      - name: Execute serialized production operation
        run: bash infra/scripts/run-remote.sh "$OPERATION" "$TARGET_RELEASE"
      - name: Verify public HTTPS from outside the host
        if: env.OPERATION != 'backup'
        run: |
          if [[ "$OPERATION" == rollback ]]; then
            python3 infra/smoke.py "https://$APP_DOMAIN" --process-only
          else
            python3 infra/smoke.py "https://$APP_DOMAIN"
          fi
      - name: Record operation result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Production operation"
            echo "Operation: $OPERATION"
            echo "Result: $RESULT"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Release candidate: $RELEASE_ID"
            echo "Rollback target: $TARGET_RELEASE"
            echo "Web image: $WEB_IMAGE"
            echo "API image: $API_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
