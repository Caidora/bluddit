[project]
name = "bluddit-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
